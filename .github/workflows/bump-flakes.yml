name: CD | Bump flakes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.3
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "chore: Bump flake.lock"
          pr-labels: |
            dependencies
            automated
